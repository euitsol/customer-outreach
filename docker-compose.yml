services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailcampaign
      POSTGRES_USER: mailcampaign
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailcampaign -d mailcampaign"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    command: gunicorn -w 2 --timeout 120 -b 0.0.0.0:8000 app.web:app
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8091:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.worker
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy

  reply_checker:
    build: .
    restart: unless-stopped
    command: python -m app.reply_checker
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
