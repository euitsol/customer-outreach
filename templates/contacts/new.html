{% extends "base.html" %}
{% block title %}Add contact{% endblock %}
{% block content %}
<div class="crumbs"><a href="{{ url_for('contacts.index') }}">Contacts</a> / New</div>
<div class="page-head"><div><h1>Add contact</h1></div></div>
<form method="post" class="card card-pad" style="max-width:760px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <label class="field"><span class="lbl">Campaign *</span>
      <select name="campaign_id" required><option value="">Choose…</option>
        {% for cp in campaigns %}<option value="{{ cp.id }}" {{ 'selected' if (form.get('campaign_id') or default_campaign|string)|string == cp.id|string }}>{{ cp.name }}</option>{% endfor %}</select></label>
    <label class="field"><span class="lbl">Email *</span><input type="email" name="email" value="{{ form.get('email','') }}" required></label>
    <label class="field"><span class="lbl">First name</span><input type="text" name="first_name" value="{{ form.get('first_name','') }}"></label>
    <label class="field"><span class="lbl">Last name</span><input type="text" name="last_name" value="{{ form.get('last_name','') }}"></label>
    <label class="field"><span class="lbl">Company</span><input type="text" name="company" value="{{ form.get('company','') }}"></label>
    <label class="field"><span class="lbl">Phone</span><input type="text" name="phone" value="{{ form.get('phone','') }}"></label>
    <label class="field"><span class="lbl">Priority</span><input type="text" name="priority" value="{{ form.get('priority','') }}" placeholder="High / Medium / Low"><div class="hint">High-priority contacts are emailed first.</div></label>
    <label class="field"><span class="lbl">Tags</span><input type="text" name="tags" value="{{ form.get('tags','') }}" placeholder="comma separated"></label>
    <label class="field full"><span class="lbl">Notes</span><textarea name="notes" rows="2">{{ form.get('notes','') }}</textarea></label>
    <label class="field full"><span class="lbl">Extra merge fields</span><textarea name="custom" rows="3" placeholder="website: https://example.com&#10;location: Dublin">{{ form.get('custom','') }}</textarea><div class="hint">One <code>name: value</code> per line. Use as <code>{{ '{{website}}' }}</code> in emails.</div></label>
  </div>
  <div class="form-actions"><button class="btn btn-primary">Add contact</button><a class="btn btn-ghost" href="{{ url_for('contacts.index') }}">Cancel</a></div>
</form>
{% endblock %}
