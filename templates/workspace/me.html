{% extends "base.html" %}
{% from "_macros.html" import csrf_field %}
{% block title %}My profile{% endblock %}
{% block content %}
<div class="page-head"><div><h1>My profile</h1><div class="sub">{{ u.email }} · {{ u.role }}</div></div></div>
<form method="post" class="card card-pad" style="max-width:520px">{{ csrf_field() }}
  <div class="stack">
    <label class="field"><span class="lbl">Name</span><input type="text" name="name" value="{{ u.name or '' }}"></label>
    <label class="field"><span class="lbl">New password <span class="faint">(leave blank to keep)</span></span><input type="password" name="password" autocomplete="new-password"></label>
  </div>
  <div class="form-actions"><button class="btn btn-primary">Save</button></div>
</form>
{% endblock %}
